version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "10:00"
    open-pull-requests-limit: 10
    # Workflows run with a token that can push to cache.kclj.io, which every
    # host trusts. Let new action releases age a week before adopting them so
    # a hijacked tag has time to be noticed and yanked.
    cooldown:
      default-days: 7
  - package-ecosystem: nix
    directory: "/"
    schedule:
      interval: daily
      time: "11:30"
    open-pull-requests-limit: 10
    groups:
      # Batch the nixpkgs channels (unstable/nixos-unstable/nixpkgs), the
      # multiverse index that tracks them, plus home-manager and nix-darwin
      # into a single PR — they track each other and should bump in lockstep.
      nixpkgs:
        patterns:
          - "darwin"
          - "home-manager"
          - "nix-index-database"
          - "nixos-hardware"
          - "nixos-unstable"
          - "nixpkgs"
          - "multiverse"
          - "unstable"
      # Build/format/CI plumbing — low blast radius, frequent tiny bumps.
      dev:
        patterns:
          - "base16"
          - "comin"
          - "deploy-rs"
          - "determinate"
          - "disko"
          - "flake-compat"
          - "flake-parts"
          - "git-hooks"
          - "import-tree"
          - "lanzaboote"
          - "nh"
          - "nimbus"
          - "noctalia"
          - "sops-nix"
          - "terranix"
          - "tinted-schemes"
          - "treefmt-nix"

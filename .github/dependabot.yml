version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "10:00"
    open-pull-requests-limit: 10
    # Workflows hold a token that can push to cache.kclj.io, which every host
    # trusts; a week's delay gives a hijacked tag time to be noticed.
    cooldown:
      default-days: 7
  - package-ecosystem: nix
    directory: "/"
    schedule:
      interval: daily
      time: "11:30"
    open-pull-requests-limit: 10
    groups:
      # These track each other, so bump them in one PR.
      nixpkgs:
        patterns:
          - "darwin"
          - "home-manager"
          - "nix-index-database"
          - "nixos-hardware"
          - "nixos-unstable"
          - "nixpkgs"
          - "multiverse"
          - "unstable"
      # Catch-all: dependabot assigns each dep to the first matching group.
      dev:
        patterns:
          - "*"

name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # Sized to GitHub's runners: linux 4 vCPU / 16 GB, macOS 3 vCPU / 7 GB.
          - system: x86_64-linux
            runner: ubuntu-24.04
            # One worker: every attr shares one single-threaded base eval, so more workers
            # just duplicate it (measured) and contend on the eval cache. eval-cores would
            # split it, but nix-eval-jobs 2.34.3 rejects it.
            eval-workers: 1
            eval-max-memory: 6144
            build-jobs: 2
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
            eval-workers: 2
            eval-max-memory: 3072
            build-jobs: 2
          - system: aarch64-darwin
            runner: macos-15
            # 7 GB total: one worker only, and two concurrent builds at most.
            eval-workers: 1
            eval-max-memory: 3072
            build-jobs: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reclaim ~30 GB of unused preinstalled toolchains before heavy builds.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/lib/node_modules \
            "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          extra-conf: |
            accept-flake-config = true
            max-substitution-jobs = 4
            # GC mid-build when space runs low instead of failing with ENOSPC; bounds sit
            # well under the smallest runner's free space.
            min-free = 2147483648
            max-free = 6442450944
            extra-substituters = https://cache.kclj.io
            extra-trusted-public-keys = cache.kclj.io-1:StGAmbogIZLS5IAQD2IQCbbmIjv3Sq8rl/AVEw4Sy7s= kclejeune:u0sa4anVXC4bKlzEsijdSlLyWVaEkApu6KWyDbbJMkk= cache.flakehub.com-3:hJuILl5sVK4iKm86JzgdXW12Y2Hwd5G07qKtHTOcDCM= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= noctalia.cachix.org-1:pCOR47nnMEo5thcxNDtzWpOxNFQsBRglJzxWPp3dkU4=

      - name: Install nimbus and nix-fast-build
        run: nix profile add --accept-flake-config --inputs-from . .#nimbus .#nix-fast-build

      - name: Build and push cacheable outputs
        env:
          NIMBUS_ENDPOINT: ${{ vars.NIMBUS_ENDPOINT }}
          NIMBUS_AUTH_TOKEN: ${{ secrets.NIMBUS_AUTH_TOKEN }}
        run: |
          nimbus watch-exec kclejeune nix-fast-build \
            --flake ".#cacheable.${{ matrix.system }}" \
            --no-nom \
            --skip-cached \
            --eval-workers ${{ matrix.eval-workers }} \
            --eval-max-memory-size ${{ matrix.eval-max-memory }} \
            -j ${{ matrix.build-jobs }}
